name: Build Maya APK

# Produces an installable app-debug.apk on GitHub's servers, so you do NOT need
# Android Studio, a JDK or the Android SDK on your own machine.
#
# How to use:
#   1. Push this project (the maya-clone folder contents) to a GitHub repo.
#   2. Actions tab -> "Build Maya APK" -> Run workflow.
#   3. When it finishes, download the "maya-debug-apk" artifact and install it.

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: maya-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
